# Runs on every push (including CMS saves) and weekly. Free on GitHub Actions.
# Cloudflare Pages builds and deploys on its own; this only reports problems.
name: Check

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC: catches external links that went dead
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: Internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/dist" 'dist/**/*.html'
          fail: true
      - name: External links (report only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/dist" --accept '200..=299,403,429' --max-concurrency 8 'dist/**/*.html'
          fail: true
