summary: >-
  The sixth edition, at the Swiss Institute of Comparative Law in Lausanne and online, compared AI
  law in the EU, China, the United States and Japan, and looked at harmonized standards and the code
  of practice for general-purpose AI. It was supported by Stiftung Mercator Schweiz.
