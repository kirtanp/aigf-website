title: AI Governance Forum 2023
theme: Regulating emerging AI technologies and applications across borders
date: '2023-12-01'
startTime: '09:00'
endTime: '16:00'
timezone: CET
format: online
summary: >-
  This year, the forum is focused on regulating emerging technologies like AI across borders.
  Regulation and governance are crucial aspects of a holistic approach towards responsible and
  trustworthy AI. The regulation process generally moves slower than the pace at which new
  technological advancements occur. So, we must try to look ahead and anticipate rather than play
  catch-up. Towards this goal, we hope to foster a discussion on recent as well as emerging
  technologies and try to answer how we could govern them in the future and the present to ensure
  that they remain beneficial to everyone instead of a select few while minimizing their adverse
  impact on the climate.
