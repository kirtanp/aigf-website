title: AI Governance Forum 2019
theme: Building Human Trust in Artificial Intelligence
date: '2019-03-23'
timezone: CET
format: in-person
city: Geneva
venue: Brocher Foundation, Hermance
summary: >-
  The first AI Governance Forum met at the Brocher Foundation near Geneva to discuss building human
  trust in AI, from accountability and privacy to an international consensus on AI policy. It was
  supported by the Swiss Federal Office of Communications (OFCOM).
supportedBy:
  - Federal Office of Communications OFCOM of the Swiss Confederation
